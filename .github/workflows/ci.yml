name: CI

# Quality gate for every push and pull request. Mirrors the local `make check`
# gate (gofmt + vet + build + test + the web/ tests) and adds what a manual run
# tends to skip: the full golangci-lint pass, dependency-vulnerability scanning,
# and the race detector (which needs cgo, so it cannot run against the normal
# pure-Go build). Keep this green before merging, the app handles secrets and
# spends on the LLM key unattended, so an ungated regression is expensive.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: generate embedded assets
        run: go generate ./knowledge ./web
      # gofmt + vet + build + test, matching `make check`.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^data/' || true)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      # Keep the codebase on `any`: gofmt -r rewrites only real interface{} type
      # expressions (never strings/comments), so this flags any that creep back.
      - name: no bare interface{}
        run: |
          legacy=$(gofmt -r 'interface{} -> any' -l $(find . -name '*.go' -not -path './data/*') || true)
          if [ -n "$legacy" ]; then
            echo "These files use interface{}; run: gofmt -r 'interface{} -> any' -w ."
            echo "$legacy"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      # web/ ships as ES modules and has no build step; Node's built-in runner
      # needs no install, so this costs one step and no dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: test web
        run: node --test "web/tests/*.test.js"

  build-test-windows:
    name: build & test (windows)
    runs-on: windows-latest
    # Windows is a shipped and primary dev target, but the rest of CI is Linux
    # only, so the *_windows.go paths (single-instance guard, console-close
    # handler) go unexercised. This job builds and tests on Windows to catch
    # platform-specific breakage. (resource.syso is generated by `make build` via
    # goversioninfo and is gitignored, so this plain build runs without it.)
    #
    # Blocking: the full suite (including the engine golden prompt-bytes test)
    # is green on Windows.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: generate embedded assets
        run: go generate ./knowledge ./web
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  race:
    name: go test -race
    runs-on: ubuntu-latest
    # The race detector requires cgo, which the shipped build deliberately does
    # not use - every dependency is pure Go so the binary cross-compiles without
    # a C toolchain, which also means `go test -race` does not run on a dev
    # machine without one. This job is the only place the engine's
    # goroutine-per-project workers, the event bus, and the WebSocket hubs are
    # exercised under it.
    #
    # Non-blocking, like the gosec full sweep below: any backlog it surfaces
    # stays visible without wedging CI. Raise to blocking once it is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: generate embedded assets
        run: go generate ./knowledge ./web
      - name: go test -race
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: generate embedded assets
        run: go generate ./knowledge ./web
      # The repo's .golangci.yml uses the v2 schema, which needs action v7+
      # (v6 rejects a v2 config and fails fast). Pin the linter version so a new
      # golangci-lint release can't turn CI red without a deliberate bump.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: generate embedded assets
        run: go generate ./knowledge ./web
      # Reports only vulnerabilities in code paths actually reached, so a failure
      # here is genuinely actionable. Blocking.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    name: gosec (high, blocking)
    runs-on: ubuntu-latest
    # Blocking gate on HIGH-severity findings. Each current HIGH finding was
    # triaged: SQL-injection (G701) and SSRF (G704) taint sites carry an inline
    # `#nosec <rule> -- <reason>` (identifiers are QuoteIdent'd/validated and
    # values are parameterized, so a NEW unguarded query/fetch still fails here).
    # The three rules excluded below are categorical false-positives on this tree,
    # each with a compensating control:
    #   G404 - math/rand is used only for non-crypto variety/jitter/name-gen;
    #          every security token uses crypto/rand (see docs/CONVENTIONS.md).
    #   G115 - integer-conversion "overflow"; all sites are spec-bounded (TOTP
    #          time counter, 65-byte P-256 key length, deterministic favicon hash).
    #   G703 - path-traversal taint on the file handlers, which guard with
    #          filepath.Base + "."/".." rejection, crypto-random O_EXCL names, and
    #          safeJoin zip-slip checks (covered by upload/static/import tests).
    # The full medium+ sweep still runs (non-blocking) in gosec-full below, so the
    # remaining backlog stays visible. Tighten by triaging medium findings, then
    # raise this job to -severity=medium.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: generate embedded assets
        run: go generate ./knowledge ./web
      - name: gosec (high severity, blocking)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-dir=data -exclude=G404,G115,G703 -severity=high -confidence=medium ./...

  gosec-full:
    name: gosec (full sweep, informational)
    runs-on: ubuntu-latest
    # Informational: prints every medium+ finding to the job log as a triage
    # backlog, but always passes (see the `|| true` below) so it never shows red
    # or blocks. Triage these down over time (a documented false-positive gets an
    # inline #nosec or a rule exclusion in the blocking gosec job above), then
    # raise that job's severity threshold.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: generate embedded assets
        run: go generate ./knowledge ./web
      - name: gosec (medium+, informational)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-dir=data -severity=medium -confidence=medium ./... || true
